<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="left">
        <div class="logo">
            <img src="images/odin-lined.png" alt="unable to load">
            ODIN
        </div>
        <p>Photo by <span class="credit">Halie West</span> on <span class="credit">Unsplash</span></p>
    </div>
    <div class="right">
        <p>
            This is not a real online service! You know you need something
            like this in your life to help you realize your deepest
            dreams. Sign up <em>now</em> to get started.<br>
            You <em>know</em> you want to.
        </p>

        <form action="" method="post">
            <div>
                <div>
                    <label for="first_name">FIRST NAME</label>
                    <input type="text" id="first_name" name="first_name" required>
                </div>
                <div>
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" required>
                </div>
            </div>
            <div>
                <div>
                    <label for="last_name">LAST NAME</label>
                    <input type="text" id="last_name" name="last_name" required>
                </div>
                <div>
                    <label for="phone_number">PHONE NUMBER</label>
                    <input type="number" id="phone_number" name="phone_number" required>
                </div>
                <div>
                    <label for="password_confirm">CONFIRM PASSWORD</label>
                    <input type="password" id="password_confirm" name="password_confirm" required>
                </div>
            </div>

            <button type="submit">Create Account</button>
            <p>Already have an account? <span>Log in</span></p>
        </form>
    </div>
</body>
</html>
